name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy pytest
      - name: Build C++ reference model
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -shared -fPIC model/reference.cpp -o build/libtpc_reference.so
      - name: Numeric, cycle, and compiler tests
        run: python -m pytest -q tests/test_numeric.py tests/test_cycle.py tests/test_compiler.py

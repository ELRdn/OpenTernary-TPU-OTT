[project]
name = "openternary-tpc-x1-design"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md", "licenses/*"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
test = ["pytest>=8"]
